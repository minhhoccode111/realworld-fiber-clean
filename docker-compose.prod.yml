version: "3.9"

x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-prefer}
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: ${GOMAXPROCS:-1}
  # App
  APP_NAME: ${APP_NAME:-realworld-fiber-clean}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  # HTTP settings
  HTTP_PORT: ${HTTP_PORT:-8080}
  HTTP_USE_PREFORK_MODE: ${HTTP_USE_PREFORK_MODE:-false}
  # Logger
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # PG
  PG_POOL_MAX: ${PG_POOL_MAX:-2}
  PG_URL: ${PG_URL}
  # Metrics
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  # Swagger
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
  # JWT
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION}
  JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
  JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-None}
  # CORS
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_HEADERS: "Origin,Content-Type,Accept,Authorization"
  CORS_ALLOW_METHODS: "GET,POST,HEAD,PUT,DELETE,PATCH"

services:
  db:
    container_name: db
    image: postgres:18.1-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - realworld_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      app_network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    container_name: app
    platform: linux/amd64
    image: minhhoccode111/realworld-fiber-clean:latest
    environment:
      <<: *x-backend-app-environment
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "2Gb"
        reservations:
          cpus: "0.60"
          memory: "1Gb"
    networks:
      app_network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app_network:
    external: false

volumes:
  realworld_data:
