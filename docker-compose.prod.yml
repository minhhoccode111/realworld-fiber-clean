version: "3.9"

x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "prefer"
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "realworld"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_USER: "${POSTGRES_USER}"

services:
  db:
    container_name: realworld-db
    image: postgres:18.1-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - realworld_data:/var/lib/postgresql/data
    networks:
      - realworld
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  app:
    container_name: realworld-fiber-clean
    image: minhhoccode111/realworld-fiber-clean:latest
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db
    networks:
      - realworld
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1Gb"
        reservations:
          cpus: "0.50"
          memory: "0.5Gb"

networks:
  # docker network create realworld
  realworld:
    external: true

volumes:
  # docker volume create realworld_data
  realworld_data:
    external: true
