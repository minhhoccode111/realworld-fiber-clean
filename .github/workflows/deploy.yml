name: Deploy Realworld Fiber

on:
  push:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest

      - name: Copy nginx config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nginx/nginx.conf"
          target: "/tmp/nginx-${{ secrets.APP_NAME }}.conf"

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          NGINX_SITE_NAME: ${{ secrets.NGINX_SITE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_VERSION: ${{ secrets.APP_VERSION }}
          CORS_ALLOW_CREDENTIALS: true
          CORS_ALLOW_HEADERS: Origin,Content-Type,Accept,Authorization
          CORS_ALLOW_METHODS: GET,POST,HEAD,PUT,DELETE,PATCH
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          HTTP_USE_PREFORK_MODE: ${{ secrets.HTTP_USE_PREFORK_MODE }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_COOKIE_SECURE: ${{ secrets.JWT_COOKIE_SECURE }}
          JWT_COOKIE_SAME_SITE: ${{ secrets.JWT_COOKIE_SAME_SITE }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          METRICS_ENABLED: ${{ secrets.METRICS_ENABLED }}
          PG_POOL_MAX: ${{ secrets.PG_POOL_MAX }}
          PG_URL: ${{ secrets.PG_URL }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -p $SSH_PORT -i ~/.ssh/deploy_key deploy@$VPS_HOST << EOF
            set -e

            # Pull the latest Docker image
            docker pull $DOCKERHUB_USERNAME/$APP_NAME:latest

            # Stop and remove old container if exists
            docker stop $APP_NAME || true
            docker rm $APP_NAME || true

            # Create env file
            echo "APP_NAME=$APP_NAME" > $APP_NAME.env
            echo "APP_VERSION=$APP_VERSION" >> $APP_NAME.env
            echo "CORS_ALLOW_CREDENTIALS=$CORS_ALLOW_CREDENTIALS" >> $APP_NAME.env
            echo "CORS_ALLOW_HEADERS=$CORS_ALLOW_HEADERS" >> $APP_NAME.env
            echo "CORS_ALLOW_METHODS=$CORS_ALLOW_METHODS" >> $APP_NAME.env
            echo "CORS_ALLOW_ORIGINS=$CORS_ALLOW_ORIGINS" >> $APP_NAME.env
            echo "HTTP_PORT=$HTTP_PORT" >> $APP_NAME.env
            echo "HTTP_USE_PREFORK_MODE=$HTTP_USE_PREFORK_MODE" >> $APP_NAME.env
            echo "JWT_EXPIRATION=$JWT_EXPIRATION" >> $APP_NAME.env
            echo "JWT_ISSUER=$JWT_ISSUER" >> $APP_NAME.env
            echo "JWT_SECRET=$JWT_SECRET" >> $APP_NAME.env
            echo "LOG_LEVEL=$LOG_LEVEL" >> $APP_NAME.env
            echo "METRICS_ENABLED=$METRICS_ENABLED" >> $APP_NAME.env
            echo "PG_POOL_MAX=$PG_POOL_MAX" >> $APP_NAME.env
            echo "PG_URL=$PG_URL" >> $APP_NAME.env
            echo "SWAGGER_ENABLED=$SWAGGER_ENABLED" >> $APP_NAME.env

            # Run the new container
            docker run -d \
              --name $APP_NAME \
              --network backend \
              --env-file $APP_NAME.env \
              -p $HTTP_PORT:$HTTP_PORT $DOCKERHUB_USERNAME/$APP_NAME:latest

            # Cleanup
            rm $APP_NAME.env
            docker system prune -f

            # Check if nginx config has changed and update if needed
            if ! cmp -s /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf; then
              sudo cp /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf
              sudo ln -sf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf /etc/nginx/sites-enabled/$NGINX_SITE_NAME.conf
              # Reload nginx
              sudo nginx -t && sudo nginx -s reload
            fi
          EOF
