name: Deploy Realworld Fiber

on:
  push:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest

      - name: Add VPS to known hosts (with retry)
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -T 10 -p ${{ secrets.SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts && break
            sleep 2
          done

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          NGINX_SITE_NAME: ${{ secrets.NGINX_SITE_NAME }}
          APP_NAME: ${{ secrets.APP_NAME }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Copy docker-compose.prod.yml and nginx config to VPS
          scp -P $SSH_PORT -i ~/.ssh/deploy_key docker-compose.prod.yml deploy@$VPS_HOST:/tmp/docker-compose-$APP_NAME.prod.yml
          scp -P $SSH_PORT -i ~/.ssh/deploy_key nginx/nginx-host.conf deploy@$VPS_HOST:/tmp/nginx-host-$APP_NAME.conf

          echo "$PROD_ENV_FILE" > /tmp/.env.$APP_NAME.prod
          scp -P $SSH_PORT -i ~/.ssh/deploy_key /tmp/.env.$APP_NAME.prod deploy@$VPS_HOST:/tmp/.env.$APP_NAME.prod
          rm -fr /tmp/.env.$APP_NAME.prod

          ssh -p $SSH_PORT -i ~/.ssh/deploy_key deploy@$VPS_HOST << EOF
            set -e

            # Create app directory and move compose file
            mkdir -p ~/$APP_NAME
            mv /tmp/docker-compose-$APP_NAME.prod.yml ~/$APP_NAME/docker-compose.prod.yml
            mv /tmp/.env.$APP_NAME.prod ~/$APP_NAME/.env.prod

            # Change to app directory
            cd ~/$APP_NAME

            # In case db is not up first run
            docker compose -f docker-compose.prod.yml up db -d

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull app

            # Stop and start services with docker-compose
            docker compose -f docker-compose.prod.yml up app -d --force-recreate

            # Cleanup
            rm -f .env.prod
            docker system prune -f

            # Check if nginx config has changed and update if needed
            if ! cmp -s /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf; then
              sudo cp /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf
              sudo ln -sf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf /etc/nginx/sites-enabled/$NGINX_SITE_NAME.conf
              # Reload nginx
              sudo nginx -t && sudo nginx -s reload
            fi
          EOF

          rm -f ~/.ssh/deploy_key
