name: Deploy Realworld Fiber

on:
  push:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:latest

      - name: Add VPS to known hosts (with retry)
        run: |
          mkdir -p ~/.ssh
          for i in 1 2 3; do
            ssh-keyscan -T 10 -p ${{ secrets.SSH_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts && break
            sleep 2
          done

      - name: Deploy to VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          NGINX_SITE_NAME: ${{ secrets.NGINX_SITE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_VERSION: ${{ secrets.APP_VERSION }}
          CORS_ALLOW_CREDENTIALS: true
          CORS_ALLOW_HEADERS: Origin,Content-Type,Accept,Authorization
          CORS_ALLOW_METHODS: GET,POST,HEAD,PUT,DELETE,PATCH
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          HTTP_PORT: ${{ secrets.HTTP_PORT }}
          HTTP_USE_PREFORK_MODE: ${{ secrets.HTTP_USE_PREFORK_MODE }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_COOKIE_SECURE: ${{ secrets.JWT_COOKIE_SECURE }}
          JWT_COOKIE_SAME_SITE: ${{ secrets.JWT_COOKIE_SAME_SITE }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          METRICS_ENABLED: ${{ secrets.METRICS_ENABLED }}
          PG_POOL_MAX: ${{ secrets.PG_POOL_MAX }}
          PG_URL: ${{ secrets.PG_URL }}
          SWAGGER_ENABLED: ${{ secrets.SWAGGER_ENABLED }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Copy docker-compose.prod.yml and nginx config to VPS
          scp -P $SSH_PORT -i ~/.ssh/deploy_key docker-compose.prod.yml deploy@$VPS_HOST:~/docker-compose.prod.yml.tmp
          scp -P $SSH_PORT -i ~/.ssh/deploy_key nginx/nginx-host.conf deploy@$VPS_HOST:/tmp/nginx-$APP_NAME.conf

          ssh -p $SSH_PORT -i ~/.ssh/deploy_key deploy@$VPS_HOST << EOF
            set -e

            # Create app directory and move compose file
            mkdir -p ~/$APP_NAME
            mv ~/docker-compose.prod.yml.tmp ~/$APP_NAME/docker-compose.prod.yml

            # Create .env.prod file
            cat > ~/$APP_NAME/.env.prod <<ENVEOF
            APP_NAME=$APP_NAME
            APP_VERSION=$APP_VERSION
            CORS_ALLOW_CREDENTIALS=$CORS_ALLOW_CREDENTIALS
            CORS_ALLOW_HEADERS=$CORS_ALLOW_HEADERS
            CORS_ALLOW_METHODS=$CORS_ALLOW_METHODS
            CORS_ALLOW_ORIGINS=$CORS_ALLOW_ORIGINS
            HTTP_PORT=$HTTP_PORT
            HTTP_USE_PREFORK_MODE=$HTTP_USE_PREFORK_MODE
            JWT_EXPIRATION=$JWT_EXPIRATION
            JWT_ISSUER=$JWT_ISSUER
            JWT_SECRET=$JWT_SECRET
            JWT_COOKIE_SECURE=$JWT_COOKIE_SECURE
            JWT_COOKIE_SAME_SITE=$JWT_COOKIE_SAME_SITE
            LOG_LEVEL=$LOG_LEVEL
            METRICS_ENABLED=$METRICS_ENABLED
            PG_POOL_MAX=$PG_POOL_MAX
            PG_URL=$PG_URL
            SWAGGER_ENABLED=$SWAGGER_ENABLED
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            ENVEOF

            # Change to app directory
            cd ~/$APP_NAME

            # In case db is not up first run
            docker compose -f docker-compose.prod.yml up db -d

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull app

            # Stop and start services with docker-compose
            docker compose -f docker-compose.prod.yml up app -d --force-recreate

            # Cleanup
            docker system prune -f

            # Check if nginx config has changed and update if needed
            if ! cmp -s /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf; then
              sudo cp /tmp/nginx-$APP_NAME.conf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf
              sudo ln -sf /etc/nginx/sites-available/$NGINX_SITE_NAME.conf /etc/nginx/sites-enabled/$NGINX_SITE_NAME.conf
              # Reload nginx
              sudo nginx -t && sudo nginx -s reload
            fi
          EOF

          rm -f ~/.ssh/deploy_key
