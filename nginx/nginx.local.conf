events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Backend API proxy (upstream for local app service)
    upstream app_backend {
        server app:8080;
    }

    # Frontend static serving (for fe.lvh.me)
    server {
        listen 80;
        server_name fe.lvh.me;
        root /var/www/realworld-react;
        index index.html;

        # React Router Fix: Fallback to index.html for SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static Assets Caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            etag on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Optional: Direct backend access (for app.lvh.me, swagger)
    server {
        listen 80;
        server_name app.lvh.me;
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
